version: '2'
services:
  bascula-app:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - 8000:8000
  bascula-mysql:
    extends:
      file: docker/mysql.yml
      service: bascula-mysql

