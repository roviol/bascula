version: '3.3'

services:
   bascula-mysql:
     image: mysql:5.7
     ports:
       - "127.0.0.1:3306:3306"

     volumes:
       - ./data:/docker-entrypoint-initdb.d
     environment:
       MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
       MYSQL_DATABASE: bascula
       MYSQL_USER: bascula
       MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
